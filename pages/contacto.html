
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header>
        <h1>Contacto</h1>
    </header>
    <main>
        <h2>Agrega tu contacto</h2>
        <form>
            <label>Nombre:</label>
            <input type="text">
            <br><br>
            <label>Correo electronico:</label>
            <input type="email">
            <br><br>
            <label>Asunto:</label>
            <input type="text">
            <br><br>
            <label>Mensaje:</label>
            <textarea></textarea>
            <br><br>
            <button type="submit">Enviar</button>
        </form>
    </main>
    <footer>
        <p>Actividad en contacto con el docente</p>
    </footer>

</body>
</html>
